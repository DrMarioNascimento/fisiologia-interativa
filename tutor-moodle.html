<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Tutor de Fisiologia — Moodle</title>
  <base target="_blank">
  <link rel="stylesheet" href="tutor-widget.css?v=4">
  <style>
    html,body{
      width:100%;height:100%;margin:0;overflow:hidden;background:transparent;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
    }

    /* No Moodle o clique no botão externo já abre diretamente o chat. */
    .tutor-launcher,.tutor-hint,.tutor-badge{display:none!important}

    .tutor-panel{
      position:absolute!important;
      inset:4px!important;
      width:auto!important;
      height:auto!important;
      max-width:620px;
      margin:0 auto;
      border-radius:18px!important;
      box-shadow:0 8px 24px rgba(3,29,33,.14)!important;
    }

    /* Boneco incorporado ao cabeçalho, sem interrogação sobre o rosto. */
    .tutor-head{
      position:relative;
      min-height:74px;
      padding-right:92px!important;
    }
    .tutor-head::after{
      content:"";
      position:absolute;
      right:14px;
      bottom:0;
      width:70px;
      height:70px;
      background:url('assets/tutor-prof-mario.png') center 2px / 76px auto no-repeat;
      pointer-events:none;
    }

    /* No iframe Moodle o X não deve fechar e deixar uma área vazia. */
    .tutor-close{display:none!important}

    @media (max-width:640px){
      .tutor-panel{inset:3px!important;border-radius:16px!important}
      .tutor-head{min-height:68px;padding-right:82px!important}
      .tutor-head::after{right:10px;width:62px;height:66px;background-size:69px auto}
    }
  </style>
</head>
<body>
  <!-- Mesma base de dados e mesma lógica do Tutor principal. -->
  <script src="tutor-ef-data.js?v=12"></script>
  <script src="tutor-widget.js?v=16"></script>
  <script>
    (function(){
      function abrir(){
        var launcher=document.querySelector('#tutorLauncher');
        var panel=document.querySelector('#tutorPanel');
        if(!launcher||!panel){setTimeout(abrir,30);return;}
        if(panel.hidden) launcher.click();
      }
      if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',function(){setTimeout(abrir,0);});
      else setTimeout(abrir,0);
    })();
  </script>
</body>
</html>
