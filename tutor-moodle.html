<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tutor de Fisiologia — Moodle</title>
  <base target="_blank">
  <style>
    :root{--g:#0f5b42;--g2:#167151;--ink:#10262b;--muted:#5e7175;--line:#dbe7e8}
    *{box-sizing:border-box}
    html,body{margin:0;background:transparent;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
    body{padding:4px}
    details{width:min(100%,520px);margin:0 auto}
    summary{list-style:none}
    summary::-webkit-details-marker{display:none}

    .avatar-summary{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;user-select:none;outline:none;padding:2px 0 4px}
    .avatar-shell{width:72px;height:72px;border-radius:50%;position:relative;overflow:hidden;background:linear-gradient(145deg,#2a8a66,var(--g));box-shadow:0 8px 18px rgba(15,91,66,.22),inset 0 1px 0 rgba(255,255,255,.4)}
    .avatar-shell::after{content:"";position:absolute;inset:4px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#eefaf4,#b9e4ce)}
    .avatar-shell img{position:absolute;z-index:2;width:82px;height:auto;left:50%;top:-13px;transform:translateX(-50%);pointer-events:none}
    .avatar-label{font-size:.78rem;font-weight:800;color:var(--g)}
    .avatar-help{font-size:.68rem;color:var(--muted)}

    .chat-wrap{margin-top:8px}
    .chat{width:100%;height:min(310px,62vh);min-height:270px;display:grid;grid-template-rows:auto 1fr auto;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 6px 18px rgba(3,29,33,.10)}
    .head{position:relative;min-height:56px;padding:10px 72px 8px 14px;color:#fff;background:linear-gradient(135deg,var(--g2),var(--g))}
    .head strong{display:block;font-size:.9rem}.head span{display:block;margin-top:2px;font-size:.68rem;opacity:.85}
    .head-avatar{position:absolute;right:8px;bottom:0;width:54px;height:56px;background:url('assets/tutor-prof-mario.png') center 1px/60px auto no-repeat}
    .messages{overflow:auto;padding:10px;background:linear-gradient(180deg,#fff,#f6faf9)}
    .msg{max-width:95%;margin:0 0 8px;padding:9px 10px;border-radius:13px;font-size:.78rem;line-height:1.38}
    .bot{border:1px solid var(--line);border-bottom-left-radius:5px;background:#fff}.user{margin-left:auto;color:#fff;background:var(--g);border-bottom-right-radius:5px}
    .chips{display:flex;gap:5px;overflow:auto;padding:6px 8px;border-top:1px solid var(--line);background:#fff}
    .chip,.link{border:1px solid rgba(22,113,81,.25);border-radius:999px;font-weight:750;cursor:pointer}
    .chip{flex:0 0 auto;min-height:30px;padding:0 9px;color:var(--g);background:#edf8f2;font-size:.72rem}
    .composer{display:grid;grid-template-columns:1fr auto;gap:6px;padding:7px 8px;border-top:1px solid var(--line);background:#fff}
    input{min-width:0;min-height:38px;padding:8px 10px;border:1px solid #bfd1d2;border-radius:11px;outline:none;font-size:.78rem}input:focus{border-color:var(--g2);box-shadow:0 0 0 3px rgba(22,113,81,.12)}
    .send{min-width:40px;border:0;border-radius:11px;color:#fff;background:var(--g);font-weight:900;cursor:pointer}
    .links{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}.link{display:inline-flex;align-items:center;min-height:30px;padding:0 9px;color:#fff;background:var(--g);text-decoration:none;font-size:.7rem}
    p{margin:0 0 7px}p:last-child{margin-bottom:0}
    @media(max-width:640px){body{padding:2px}details{width:min(100%,94vw)}.avatar-shell{width:68px;height:68px}.avatar-shell img{width:78px;top:-12px}.chat{height:min(330px,68vh);min-height:260px;border-radius:14px}.head{min-height:54px;padding-right:68px}.head-avatar{right:6px;width:50px;height:54px;background-size:56px auto}}
  </style>
</head>
<body>
  <details id="tutorAccordion">
    <summary class="avatar-summary" aria-label="Abrir chat do Tutor de Fisiologia">
      <span class="avatar-shell"><img src="assets/tutor-prof-mario.png" alt="Tutor de Fisiologia"></span>
      <span class="avatar-label">Clique no Tutor</span>
      <span class="avatar-help">para abrir o chat</span>
    </summary>

    <div class="chat-wrap">
      <section class="chat" aria-label="Chat do Tutor de Fisiologia">
        <header class="head"><strong>Tutor de Fisiologia</strong><span>Educação Física • estudo guiado</span><div class="head-avatar" aria-hidden="true"></div></header>
        <div class="messages" id="messages"><div class="msg bot">Olá! O que você quer estudar? Posso localizar simuladores, mapas mentais e aprofundamentos da disciplina.</div></div>
        <div>
          <div class="chips">
            <button class="chip" type="button" data-action="simuladores">Simuladores</button>
            <button class="chip" type="button" data-action="mapas">Mapas mentais</button>
            <button class="chip" type="button" data-action="aprofundamentos">Aprofundamentos</button>
            <button class="chip" type="button" data-action="questoes">Questões</button>
          </div>
          <form class="composer" id="form"><input id="input" maxlength="240" placeholder="Ex.: potencial de ação, retorno venoso, sangue..." aria-label="Pergunta ao tutor"><button class="send" aria-label="Enviar">➜</button></form>
        </div>
      </section>
    </div>
  </details>

  <script src="tutor-ef-data.js?v=12"></script>
  <script>
    (function(){
      const box=document.getElementById('messages'),input=document.getElementById('input'),acc=document.getElementById('tutorAccordion');
      const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9+]+/g,' ').trim();
      const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const base='https://drmarionascimento.github.io/fisiologia-interativa/';
      const add=(html,who='bot')=>{const d=document.createElement('div');d.className='msg '+who;d.innerHTML=html;box.appendChild(d);box.scrollTop=box.scrollHeight};
      const linkList=items=>'<div class="links">'+items.map(x=>`<a class="link" href="${esc(base+x.href)}">${esc(x.title)}</a>`).join('')+'</div>';
      const mapItems=()=>Object.values(typeof maps==='object'?maps:{}).flatMap(v=>Array.isArray(v)?v:[v]).filter(Boolean).map(x=>({title:x.title,href:x.src}));
      const moduleItems=()=>Array.isArray(modules)?modules:[];
      const profundos=()=>moduleItems().filter(m=>['da-intencao-ao-movimento.html','sangue.html','ventilacao-pulmonar-neonatal.html'].includes(m.href)||/aprofund|integr|sangue|neonatal|intencao/i.test(`${m.title||''} ${m.goal||''} ${m.href||''}`));
      function find(q){const terms=norm(q).split(' ').filter(t=>t.length>2);return moduleItems().map(m=>{const hay=norm(`${m.title} ${m.goal} ${(m.steps||[]).join(' ')}`);let score=0;terms.forEach(t=>{if(hay.includes(t))score+=norm(m.title).includes(t)?5:1});return{m,score}}).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,6).map(x=>x.m)}
      function act(type){
        if(type==='simuladores')return add('<p><b>Qual simulador você quer explorar?</b></p>'+linkList(moduleItems().map(m=>({title:m.title,href:m.href}))));
        if(type==='mapas')return add('<p><b>Escolha um mapa mental:</b></p>'+linkList(mapItems()));
        if(type==='aprofundamentos')return add('<p><b>Aprofundamentos disponíveis:</b></p>'+linkList(profundos().map(m=>({title:m.title,href:m.href}))));
        if(type==='questoes')return add('<p>Digite o tema que deseja revisar. Eu localizo os módulos correspondentes; dentro deles, use o Tutor para testar seu entendimento.</p>');
      }
      function submit(text){
        const q=String(text||'').trim();if(!q)return;add(esc(q),'user');input.value='';const n=norm(q);
        if(/mapa/.test(n))return act('mapas');
        if(/aprofund/.test(n))return act('aprofundamentos');
        if(/simulador|simuladores/.test(n))return act('simuladores');
        const found=find(q);
        if(!found.length)return add('<p>Não encontrei uma correspondência segura. Tente o nome de uma estrutura, sistema ou mecanismo, como <b>cálcio</b>, <b>retorno venoso</b>, <b>hemoglobina</b> ou <b>recrutamento</b>.</p>');
        add('<p><b>Encontrei estes conteúdos relacionados:</b></p>'+linkList(found.map(m=>({title:m.title,href:m.href}))));
      }
      document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>act(b.dataset.action)));
      document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();submit(input.value)});
      acc.addEventListener('toggle',()=>{if(acc.open)setTimeout(()=>input.focus(),80)});
    })();
  </script>
</body>
</html>
