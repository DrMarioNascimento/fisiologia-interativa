<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Tutor de Fisiologia — Moodle</title>
  <base target="_blank">
  <link rel="stylesheet" href="tutor-widget.css?v=4">
  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{min-height:340px}

    /* No Moodle o avatar fica no alto: evita uma grande área vazia. */
    .tutor-launcher{
      position:fixed;
      left:50%;
      right:auto;
      top:18px;
      bottom:auto;
      width:76px;
      height:76px;
      transform:translateX(-50%);
    }
    .tutor-launcher:hover{transform:translateX(-50%) translateY(-2px)}
    .tutor-launcher.is-dragging{transform:scale(1.04)}

    /* Badge deslocado para fora do rosto. */
    .tutor-launcher .tutor-badge{
      right:-16px;
      top:-8px;
    }

    .tutor-hint{
      position:fixed;
      left:50%;
      right:auto;
      top:104px;
      bottom:auto;
      transform:translateX(-50%);
      width:max-content;
      max-width:min(330px,calc(100vw - 28px));
      text-align:center;
    }

    /* Ao abrir, o chat usa praticamente toda a área do iframe. */
    .tutor-panel{
      position:fixed;
      inset:8px;
      width:auto;
      height:auto;
      max-width:520px;
      margin:0 auto;
      border-radius:20px;
    }
    .tutor-panel.is-open + .tutor-launcher{visibility:hidden}

    @media (max-width:640px){
      body{min-height:320px}
      .tutor-launcher{
        left:50%;
        right:auto;
        top:14px;
        bottom:auto;
        width:70px;
        height:70px;
      }
      .tutor-hint{left:50%;right:auto;top:96px;bottom:auto;max-width:calc(100vw - 24px)}
      .tutor-panel{inset:6px;width:auto;height:auto;border-radius:18px}
    }
  </style>
</head>
<body>
  <!-- Usa exatamente a mesma base de dados e a mesma lógica do Tutor principal. -->
  <script src="tutor-ef-data.js?v=12"></script>
  <script src="tutor-widget.js?v=16"></script>
</body>
</html>
