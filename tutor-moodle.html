<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Tutor de Fisiologia — Moodle</title>
  <base target="_blank">
  <link rel="stylesheet" href="tutor-widget.css?v=4">
  <style>
    html,body{
      width:100%;height:100%;margin:0;overflow:hidden;background:transparent;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
    }

    /* No Moodle o botão externo já abre diretamente o chat. */
    .tutor-launcher,.tutor-hint,.tutor-badge{display:none!important}

    .tutor-panel{
      position:absolute!important;
      inset:4px!important;
      width:auto!important;
      height:auto!important;
      max-width:620px;
      margin:0 auto;
      border-radius:18px!important;
      box-shadow:0 8px 24px rgba(3,29,33,.14)!important;
    }

    /* Boneco incorporado ao cabeçalho, sem interrogação. */
    .tutor-head{
      position:relative;
      min-height:74px;
      padding-right:92px!important;
    }
    .tutor-head::after{
      content:"";
      position:absolute;
      right:14px;
      bottom:0;
      width:70px;
      height:70px;
      background:url('assets/tutor-prof-mario.png') center 2px / 76px auto no-repeat;
      pointer-events:none;
    }

    .tutor-close{display:none!important}

    @media (max-width:640px){
      .tutor-panel{inset:3px!important;border-radius:16px!important}
      .tutor-head{min-height:68px;padding-right:82px!important}
      .tutor-head::after{right:10px;width:62px;height:66px;background-size:69px auto}
    }
  </style>
</head>
<body>
  <script src="tutor-ef-data.js?v=12"></script>
  <script src="tutor-widget.js?v=16"></script>
  <script>
    (function(){
      function abrirDireto(){
        var panel=document.querySelector('#tutorPanel');
        var messages=document.querySelector('#tutorMessages');
        var context=document.querySelector('#tutorContext');
        if(!panel||!messages){setTimeout(abrirDireto,40);return;}

        panel.hidden=false;
        panel.classList.add('is-open');
        if(context && !context.textContent.trim()) context.textContent='Educação Física • percurso geral';

        if(!messages.children.length){
          var el=document.createElement('div');
          el.className='tutor-message bot';
          el.textContent='Olá! Diga o que deseja estudar. Posso indicar mapas mentais, simuladores, aprofundamentos e questões da disciplina.';
          messages.appendChild(el);
        }

        var input=document.querySelector('#tutorInput');
        if(input) setTimeout(function(){input.focus();},80);
      }

      if(document.readyState==='loading'){
        document.addEventListener('DOMContentLoaded',function(){setTimeout(abrirDireto,80);},{once:true});
      }else{
        setTimeout(abrirDireto,80);
      }
    })();
  </script>
</body>
</html>
