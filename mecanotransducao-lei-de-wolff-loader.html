<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mecanotransdução Óssea e Lei de Wolff</title><style>body{margin:0;background:#f7f2e7;font-family:system-ui}.loader{min-height:100vh;display:grid;place-items:center}</style></head><body><div class="loader">Carregando simulador…</div><script>(async()=>{try{const urls=Array.from({length:7},(_,i)=>`assets/data/mecanotransducao/part${i+1}.txt`);const parts=await Promise.all(urls.map(async u=>(await (await fetch(u,{cache:'no-cache'})).text()).trim()));const bin=atob(parts.join(''));const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');let html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();html=html.replace('@media(prefers-reduced-motion:reduce){','@media(min-width:900px){.mobile-topbar,.mobile-tabnav,.wrap{width:min(calc(100% - 48px),1160px);margin-left:auto;margin-right:auto}.mobile-topbar{margin-top:14px;border:1px solid var(--border);border-radius:18px 18px 0 0}.mobile-tabnav{top:72px;border-left:1px solid var(--border);border-right:1px solid var(--border)}.wrap{max-width:1160px;padding:0 14px}}@media(prefers-reduced-motion:reduce){');document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="loader">Não foi possível carregar o simulador. Atualize a página.</div>';console.error(e)}})();</script></body></html>
