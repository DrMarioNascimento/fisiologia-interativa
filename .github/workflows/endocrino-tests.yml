name: Testes do Sistema Endócrino
on:
  push:
    paths: ['endocrino/**', '.github/workflows/endocrino-tests.yml']
  pull_request:
    paths: ['endocrino/**', '.github/workflows/endocrino-tests.yml']
jobs:
  endocrino:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verificar modelo, cenários e controles
        run: node --test endocrino/tests.mjs
      - name: Verificar curvas esperadas e preservação da referência
        run: node --test endocrino/thyroid-reference-tests.mjs
      - name: Verificar núcleo tireoidiano compartilhado e dados publicados
        run: node endocrino/thyroid-evidence-tests.mjs
      - name: Verificar ciclo menstrual e gestação
        run: node endocrino/ciclo/tests.mjs
      - name: Verificar transição menopausal e manipulação hormonal
        run: node --test endocrino/menopausa/tests.mjs
      - name: Verificar cortisol, cenários temporais e limites do modelo
        run: node --test endocrino/cortisol-tests.mjs
