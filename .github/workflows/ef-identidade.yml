name: Identidade visual da Educação Física
on:
  push:
    paths: ['*.html', 'ef-simuladores*', 'endocrino/**', 'tests/ef-identidade.test.mjs', '.github/workflows/ef-identidade.yml']
  pull_request:
    paths: ['*.html', 'ef-simuladores*', 'endocrino/**', 'tests/ef-identidade.test.mjs', '.github/workflows/ef-identidade.yml']
jobs:
  cobertura:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/ef-identidade.test.mjs
