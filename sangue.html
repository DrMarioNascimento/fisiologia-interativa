<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Simulador interativo Sangue: hematopoiese, transporte de oxigênio e integração fisiológica.">
  <meta name="sim-category" content="cardiovascular">
  <title>Sangue — Hematopoiese e integração fisiológica</title>
  <style>
    :root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17324f;background:#eef4fa}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 0,rgba(216,57,62,.10),transparent 30rem),linear-gradient(180deg,#f9fbfe,#eaf2f9)}
    .load{width:min(520px,100%);padding:28px;border:1px solid #d4dfeb;border-radius:22px;background:#fff;box-shadow:0 20px 50px rgba(25,62,99,.14);text-align:center}
    .drop{width:58px;height:72px;margin:0 auto 16px;border-radius:55% 55% 58% 58%/68% 68% 40% 40%;background:linear-gradient(145deg,#ef4b50,#9f0f1b);box-shadow:inset 8px 8px 13px rgba(255,255,255,.38),inset -9px -10px 15px rgba(78,0,10,.26),0 10px 22px rgba(130,20,30,.22);transform:rotate(45deg);animation:pulse 1.3s ease-in-out infinite}
    .load h1{margin:0 0 8px;font-size:1.55rem}.load p{margin:0;color:#647084;line-height:1.55}.bar{height:7px;margin-top:20px;overflow:hidden;border-radius:99px;background:#e2eaf2}.bar i{display:block;width:34%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#d8393e,#7b1d28);animation:move 1.1s ease-in-out infinite alternate}
    @keyframes pulse{50%{transform:rotate(45deg) scale(1.07)}}@keyframes move{to{transform:translateX(195%)}}
    .error{color:#8f1d27!important;font-weight:700}
  </style>
  <link rel="stylesheet" href="tutor-widget.css?v=3">
</head>
<body>
  <main class="load" aria-live="polite">
    <div class="drop" aria-hidden="true"></div>
    <h1>Sangue</h1>
    <p id="status">Carregando o simulador de hematopoiese e integração fisiológica…</p>
    <div class="bar" aria-hidden="true"><i></i></div>
  </main>
  <script>
    (async()=>{
      const status=document.getElementById('status');
      const parts=Array.from({length:11},(_,i)=>`./assets/data/sangue/bundle${String(i+1).padStart(2,'0')}.txt?v=20260822`);
      const chunks=[];
      for(let i=0;i<parts.length;i++){
        status.textContent=`Carregando o simulador… ${i+1}/${parts.length}`;
        const response=await fetch(parts[i],{cache:'no-cache'});
        if(!response.ok) throw new Error(`Pacote ${i+1} indisponível (${response.status}).`);
        chunks.push((await response.text()).trim());
      }
      const encoded=chunks.join('').replace(/\s+/g,'');
      const binary=atob(encoded);
      const bytes=new Uint8Array(binary.length);
      for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
      if(!('DecompressionStream' in window)) throw new Error('Este navegador não oferece descompactação nativa. Atualize o navegador.');
      const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      const html=await new Response(stream).text();
      if(!html.toLowerCase().includes('<!doctype html')) throw new Error('O pacote do simulador não pôde ser validado.');
      document.open();
      document.write(html);
      document.close();
    })().catch(error=>{
      console.error(error);
      const status=document.getElementById('status');
      if(status){status.className='error';status.textContent=`Não foi possível abrir o simulador. ${error.message}`;}
      document.querySelector('.bar')?.remove();
    });
  </script>
  <script src="tutor-ef-data.js?v=8"></script>
  <script src="tutor-widget.js?v=6"></script>
</body>
</html>
