<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Homeostase do cálcio – fisiologia interativa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--panel:#fbfbfd;--line:#d9dce3;--text:#1f2937;--muted:#6b7280;--ca:#2563eb;--phos:#8b5cf6;--pth:#dc2626;--calc:#ec4899;--normal:#cbd5e1;--phase:#2563eb}
*{box-sizing:border-box} body{margin:0;padding:22px;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
h1{margin:0 0 8px;font-size:30px;text-align:center}.subtitle{margin:0 0 12px;text-align:center;color:var(--muted);font-size:16px}
.controls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin:0 auto 8px;max-width:1440px}
.mode-line{max-width:1440px;margin:0 auto 14px;text-align:right;min-height:22px}.mode-badge{display:inline-block;font-size:12px;color:var(--muted);background:#fff;border:1px solid #e1e5ec;border-radius:999px;padding:4px 10px}
button{border:1px solid #b9c0cc;border-radius:10px;padding:10px 14px;font-size:15px;background:#fff;cursor:pointer}.primary{border-color:#96b7ff}
label{display:flex;gap:8px;align-items:center;font-size:14px;background:#fff;border:1px solid #e1e5ec;border-radius:10px;padding:9px 12px} input[type=range]{width:140px}
.stage-map{max-width:1440px;margin:0 auto 12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}.stage-track{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.stage-node{min-height:84px;padding:10px 12px;border-radius:14px;border:2px solid #d7dce5;background:#fff}.stage-num{display:inline-flex;width:24px;height:24px;align-items:center;justify-content:center;border-radius:999px;background:#eef2ff;color:#1e3a8a;font-size:12px;font-weight:700;margin-bottom:8px}.stage-name{font-size:14px;font-weight:700;line-height:1.2}.stage-mini{margin-top:6px;color:var(--muted);font-size:12px;line-height:1.3}
.status-grid{display:grid;grid-template-columns:1.15fr .9fr .95fr;gap:12px;max-width:1440px;margin:0 auto 14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-height:126px;position:relative;overflow:hidden}.card::before{content:"";position:absolute;inset:0 auto 0 0;width:8px;background:var(--phase)}.card-title{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}.phase{font-size:26px;font-weight:700;line-height:1.12;padding-left:4px;min-height:86px;display:flex;flex-direction:column;justify-content:flex-start}.phase small{display:block;margin-top:6px;font-size:14px;color:var(--muted);font-weight:400}#valueCard{min-height:150px}#valueText{font-size:24px}#valueDesc{font-size:12px;line-height:1.35}.ref-head{display:block;color:#dc2626;font-weight:700;margin-top:8px}.ref-line{display:block}
.layout{display:grid;grid-template-columns:minmax(560px,1.12fr) minmax(520px,.95fr);gap:16px;max-width:1440px;margin:0 auto}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px}
.scene-wrap{position:relative;width:100%;max-width:980px;margin:0 auto;height:auto;overflow:visible} #sceneCanvas,#graphCanvas{width:100%;height:auto;display:block;border:1px solid #e5e7eb;border-radius:12px} #sceneCanvas{background:transparent;position:relative;z-index:2} #graphCanvas{background:#fff}
.scene-bg{position:absolute;inset:0;background:#fff;border:1px solid #e5e7eb;border-radius:12px;z-index:0}
.organ-img{display:none !important}
.sun-img{left:34px;top:72px;width:92px;height:92px;object-fit:cover;object-position:center top;border-radius:50%}.liver-img{left:250px;top:86px;width:168px}.kidney-img{left:560px;top:98px;width:98px}.thyroid-img{left:792px;top:92px;width:108px}.intestine-img{left:748px;top:458px;width:176px}.bone-img{left:420px;top:482px;width:184px;transform:rotate(-18deg);transform-origin:center center}
.graph-note{font-size:13px;color:#64748b;text-align:right;max-width:1440px;margin:4px auto 0;padding-right:8px}.legend{max-width:1440px;margin:14px auto 0;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px 28px;line-height:1.55;font-size:15px}.signature{text-align:right;color:#4b5563;font-size:14px;margin-top:18px;border-top:1px solid #e5e7eb;padding-top:10px}.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;border:1px solid var(--line);margin-left:6px;color:var(--muted);background:#fff}
@media (max-width:1180px){.layout{grid-template-columns:1fr}.status-grid{grid-template-columns:1fr}.stage-track{grid-template-columns:1fr 1fr}}


/* === PADRÃO VISUAL CONSOLIDADO — PROF. MÁRIO | BLOCO 3 === */
:root{
  --std-shadow:0 16px 34px rgba(18,42,66,.13),0 4px 10px rgba(18,42,66,.07),inset 0 1px 0 rgba(255,255,255,.92);
  --std-soft-shadow:0 8px 18px rgba(18,42,66,.12),inset 0 1px 0 rgba(255,255,255,.92);
  --std-radius:20px;
  --c-calcio:#1F78B4;
  --c-fosfato:#6A3D9A;
  --c-pth:#E31A1C;
  --c-calcitonina:#E3127C;
  --c-solar:#FF7F00;
  --c-rim:#00A6D6;
  --c-intestino:#33A02C;
  --c-osso:#B15928;
}
body{
  background:
    radial-gradient(circle at 12% 4%,rgba(47,128,237,.07),transparent 30%),
    radial-gradient(circle at 88% 10%,rgba(43,138,102,.06),transparent 28%),
    linear-gradient(180deg,#fbfdff 0%,#eef4fb 100%);
  font-family:Inter,"Segoe UI",Arial,sans-serif;
}
h1{color:#17324d;letter-spacing:.2px;font-weight:900}.subtitle{color:#5c7086}
.controls,.quick,.stage-map,.panel,.legend{
  background:linear-gradient(145deg,#ffffff 0%,#f7fbff 100%);
  border:1px solid #d5e0eb;
  box-shadow:var(--std-shadow);
  border-radius:var(--std-radius);
}
.mode-badge{background:linear-gradient(180deg,#fff,#f2f7fc);border:1px solid #d5e0eb;box-shadow:var(--std-soft-shadow);border-radius:999px;font-weight:800}
.controls-actions{justify-content:center;margin-bottom:10px}.quick{max-width:1440px;margin:0 auto 12px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-start}
button{
  min-height:42px;border:1px solid #c4d0dc!important;border-radius:14px;padding:9px 16px;font-size:14px;font-weight:850;color:#17324d;
  background:linear-gradient(180deg,#ffffff 0%,#eaf2fb 100%);box-shadow:0 5px 0 #cbd7e3,0 9px 16px rgba(18,42,66,.13),inset 0 1px 0 rgba(255,255,255,.95);
  transition:.18s transform,.18s filter,.18s box-shadow;cursor:pointer
}
button:hover{transform:translateY(-2px);filter:brightness(1.03);box-shadow:0 6px 0 #cbd7e3,0 12px 20px rgba(18,42,66,.15)}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #cbd7e3,0 5px 9px rgba(18,42,66,.12)}
button.primary,#btnStart{color:#fff;border-color:#246cc3!important;background:linear-gradient(145deg,#5aaaff 0%,#2f80ed 55%,#2567bd 100%);box-shadow:0 5px 0 #1f5d9f,0 10px 19px rgba(47,128,237,.24),inset 0 1px 0 rgba(255,255,255,.35)}
#btnPause{border-color:#efb46c!important;background:linear-gradient(145deg,#fff8ed,#fed7aa);color:#9a3412;box-shadow:0 5px 0 #e4a85d,0 9px 16px rgba(154,52,18,.14)}
#btnStep{border-color:#72c99a!important;background:linear-gradient(145deg,#effdf6,#bbf7d0);color:#166534;box-shadow:0 5px 0 #5eb784,0 9px 16px rgba(22,101,52,.14)}
#btnReset{background:linear-gradient(145deg,#fff,#e2e8f0);color:#334155}
label{border:1px solid #d7e1ec;border-radius:14px;background:#ffffff;box-shadow:0 1px 4px rgba(18,42,66,.05);font-weight:700;color:#17324d}
input[type=range]{appearance:none;width:140px;height:10px;border-radius:999px;background:linear-gradient(180deg,#cbd8e6,#eef5fb);box-shadow:inset 0 2px 4px rgba(18,42,66,.23),0 1px 0 #fff;accent-color:#2f80ed}
input[type=range]::-webkit-slider-thumb{appearance:none;width:22px;height:22px;border-radius:50%;border:2px solid #fff;background:radial-gradient(circle at 32% 28%,#a9d5ff 0%,#2f80ed 48%,#1f5ea8 100%);box-shadow:0 3px 8px rgba(18,42,66,.28),0 0 0 1px #246cc3;cursor:pointer}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;border:2px solid #fff;background:radial-gradient(circle at 32% 28%,#a9d5ff 0%,#2f80ed 48%,#1f5ea8 100%);box-shadow:0 3px 8px rgba(18,42,66,.28),0 0 0 1px #246cc3;cursor:pointer}
input[type=checkbox],input[type=radio]{accent-color:#2f80ed}
.quick label{font-size:13px;font-weight:850;transition:.18s ease;padding:9px 12px}.quick label:has(input:checked){color:#fff;background:linear-gradient(135deg,#2f80ed,#57a7ff);box-shadow:0 0 0 3px rgba(47,128,237,.18),0 8px 18px rgba(47,128,237,.16);border-color:#8ec5ff}.mode-line{margin-top:0}
.stage-map{padding:12px}.stage-node{position:relative;overflow:hidden;border-width:1px!important;box-shadow:0 9px 18px rgba(18,42,66,.11),inset 0 1px 0 rgba(255,255,255,.9)!important;border-radius:16px!important;transition:transform .18s ease,box-shadow .18s ease}.stage-node:hover{transform:translateY(-2px);box-shadow:0 13px 23px rgba(18,42,66,.14),inset 0 1px 0 rgba(255,255,255,.9)!important}.stage-node::after{content:"";position:absolute;right:-42px;bottom:-44px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,rgba(47,128,237,.16),transparent 70%);pointer-events:none}.stage-name{font-weight:900}.stage-mini{color:#5c7086!important}
.card{
  --card-color:var(--phase);
  position:relative;overflow:hidden;border-radius:18px;padding:14px 16px 14px 20px;min-height:142px;
  background:linear-gradient(145deg,#ffffff 0%,#f3f8fc 100%);border:1px solid #d5e0eb;box-shadow:0 12px 24px rgba(18,42,66,.12),inset 0 1px 0 rgba(255,255,255,.92);isolation:isolate;
}
.card::before{left:-4px;top:10px;bottom:10px;width:10px;background:linear-gradient(180deg,var(--card-color),color-mix(in srgb,var(--card-color) 68%,#fff 32%));border-radius:999px;box-shadow:0 0 11px color-mix(in srgb,var(--card-color) 42%,transparent)}.card::after{content:"";position:absolute;right:-54px;bottom:-54px;width:138px;height:138px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--card-color) 24%,white 76%) 0%,transparent 70%);opacity:.65;pointer-events:none}.card>*{position:relative;z-index:1}.card-title{font-size:12px;color:#64748b;font-weight:900;text-transform:uppercase;letter-spacing:.08em}.phase{font-size:26px;font-weight:900;color:#17324d}.phase small{color:#5c7086}.ref-head{color:#E31A1C}.panel{border-radius:20px;padding:14px}.scene-bg,#sceneCanvas,#graphCanvas{border-radius:16px;border-color:#d7e1ec;box-shadow:inset 0 2px 6px rgba(18,42,66,.08),0 8px 18px rgba(18,42,66,.07)}.graph-note{display:none}.legend{padding:16px 18px 18px;line-height:1.6;text-align:justify}.signature{font-size:14px;color:#5c7086;font-weight:650}.pill{border-radius:999px}.stage-track{gap:10px}



/* === Ajuste final: etapas mais legíveis e esferas sem borda branca === */
.stage-map{padding:16px 18px!important;}
.stage-track{grid-template-columns:repeat(6,minmax(136px,1fr))!important;gap:14px!important;}
.stage-node{min-height:96px!important;padding:12px 10px!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;text-align:center!important;}
.stage-name{font-size:clamp(15px,1.05vw,17px)!important;line-height:1.18!important;white-space:nowrap!important;font-weight:900!important;}
.stage-mini{font-size:12.5px!important;line-height:1.22!important;text-align:center!important;}
@media (max-width:1180px){.stage-track{grid-template-columns:repeat(2,minmax(0,1fr))!important}.stage-name{white-space:normal!important}}


/* === Padrão mobile universal: fonte + alvos de toque maiores (aplicado a todos os simuladores) === */
@media (max-width:760px){
  button{ min-height:44px; padding:11px 16px; font-size:15px; }
  label{ min-height:40px; padding:8px 10px; }
  input[type="range"]{ width:100%; height:28px; }
  input[type="range"]::-webkit-slider-thumb{ width:26px; height:26px; }
  input[type="checkbox"], input[type="radio"]{ width:20px; height:20px; }
  select{ min-height:44px; font-size:15px; }
  a{ min-height:44px; display:inline-flex; align-items:center; }
}

/* === Padrão mobile: cabeçalho sticky + abas (aplicado em lote) === */
.mobile-topbar{ display:none; }
.mobile-tabnav{ display:none; }
@media (max-width:760px){
  h1{ display:none; }
  .mobile-topbar{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    position:sticky; top:0; z-index:50; padding:12px 14px;
    background:linear-gradient(180deg,#ffffff 0%, #f8fbff 100%);
    border-bottom:1px solid #d7e1ec; box-shadow:0 6px 16px rgba(18,42,66,.10);
  }
  .mobile-topbar h2{ margin:0; font-size:16px; line-height:1.2; color:#17324d; }
  .mobile-playtoggle{
    border:none; border-radius:12px; padding:10px 16px; font-size:14px; font-weight:800;
    color:#fff; background:linear-gradient(135deg,#2f80ed,#57a7ff);
    min-height:44px; min-width:44px; cursor:pointer;
  }
  .mobile-tabnav{
    display:grid; grid-template-columns:repeat(3,1fr); gap:6px;
    position:sticky; top:64px; z-index:49; padding:8px 10px;
    background:#eef4fb; border-bottom:1px solid #d7e1ec;
  }
  .mobile-tabnav button{
    border:none; border-radius:10px; padding:10px 6px; font-size:13px; font-weight:700;
    color:#36536d; background:#fff; min-height:44px; cursor:pointer;
  }
  .mobile-tabnav button.active{ color:#fff; background:linear-gradient(135deg,#2f80ed,#57a7ff); }
  [data-tab]{ display:none !important; }
  [data-tab].tab-active{ display:block !important; }
  .status-grid[data-tab].tab-active{ display:grid !important; }
}
</style>
</head>
<body>
  <div class="mobile-topbar">
    <h2>Homeostase do cálcio – fisiologia interativa</h2>
    <button class="mobile-playtoggle" id="mobilePlayToggle">▶ Inici
